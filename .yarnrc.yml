approvedGitRepositories:
  - "https://npm-registry.sipwise.com/*"

enableScripts: true

npmMinimalAgeGate: 0

# vue-template-compiler: XSS via prototype pollution (GHSA #81), no patched
# version exists (Vue 2 is EOL). Only reachable here as a transitive
# devDependency of @quasar/quasar-app-extension-testing-unit-jest, via
# alias-hq's unused jscodeshift codemod feature - never invoked by this
# project and never shipped in the production bundle.
npmAuditExcludePackages:
  - vue-template-compiler

enableTelemetry: false

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.17.1.cjs

npmRegistryServer: "https://npm-registry.sipwise.com/"


